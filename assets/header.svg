<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Bugra Yalcin">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="55%" stop-color="#3AA9FF"/>
      <stop offset="100%" stop-color="#00D9C0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9C0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00D9C0" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1E2733"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1000" height="240" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="#0B0F14"/>
    <rect width="1000" height="240" fill="url(#dots)"/>
    <rect x="0" y="0" width="1000" height="3" fill="url(#accent)"/>

    <!-- devre izleri -->
    <g stroke="url(#fade)" stroke-width="1.4" fill="none" opacity="0.75">
      <path d="M660 44 H812 a10 10 0 0 1 10 10 V96 H960"/>
      <path d="M700 196 H858 a10 10 0 0 0 10 -10 V140 H960"/>
      <path d="M868 118 H960"/>
      <path d="M744 118 H820"/>
    </g>
    <g fill="#00D9C0">
      <circle cx="822" cy="96" r="3.2"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="868" cy="140" r="3.2"><animate attributeName="opacity" values="1;0.25;1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="744" cy="118" r="3.2" opacity="0.5"/>
      <circle cx="660" cy="44" r="3.2" opacity="0.35"/>
      <circle cx="700" cy="196" r="3.2" opacity="0.35"/>
    </g>
    <rect x="820" y="106" width="48" height="26" rx="4" fill="#0F1720" stroke="#233040" stroke-width="1.2"/>
    <text x="844" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3AA9FF" text-anchor="middle">MCU</text>

    <!-- metin -->
    <text x="56" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#4A5A6A">$ whoami</text>
    <rect x="139" y="54" width="8" height="16" fill="#00D9C0">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="56" y="132" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="#E8EEF5" letter-spacing="-1">Buğra Yalçın</text>

    <text x="58" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="url(#accent)">embedded systems  ·  machine learning  ·  autonomy</text>

    <text x="58" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#41505F">Balıkesir Üniversitesi — Bilgisayar Mühendisliği</text>

    <rect x="0" y="237" width="1000" height="3" fill="url(#accent)" opacity="0.5"/>
  </g>
</svg>
